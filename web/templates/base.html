<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <link rel="icon" href="data:,">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }} · Zapatería Distribuida</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
    <script src="{{ url_for('static', filename='app.js') }}" defer></script>
    {% block scripts %}{% endblock %}
</head>
<body>
<a class="skip-link" href="#contenido">Ir al contenido</a>
<aside class="sidebar" id="menu">
    <div class="sidebar-header">
        <button class="menu-toggle btn" type="button" aria-controls="menu" aria-expanded="false"
                aria-label="Abrir menú de navegación" hidden>
            <span class="menu-toggle-icon" aria-hidden="true"></span>
        </button>
        <a href="{{ url_for('dashboard') }}" class="brand">
            <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
            <span>Zapatería<span class="brand-subtitle">Distribuida</span></span>
        </a>
    </div>
    <nav class="sidebar-nav" aria-label="Navegación principal">
        {% for endpoint, label, icon in navigation %}
        <a class="nav-link" href="{{ url_for(endpoint) }}"{% if endpoint == active %} aria-current="page"{% endif %}>
            <span class="nav-icon icon-{{ icon }}" aria-hidden="true"></span>{{ label }}
        </a>
        {% endfor %}
    </nav>
</aside>
<div class="main-shell">
    <header class="topbar">
        <span class="read-only"><span aria-hidden="true"></span>Solo lectura</span>
    </header>
    <main id="contenido" class="container-fluid main-content">
        {% block content %}{% endblock %}
    </main>
</div>
</body>
</html>
